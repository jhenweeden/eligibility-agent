<!--
  Paste this into a WordPress "Custom HTML" block on the page where you
  want the eligibility check to appear. Replace WIDGET_URL below with
  your deployed Vercel URL (e.g. https://your-project.vercel.app).
-->

<div class="et_pb_button_module_wrapper et_pb_button_alignment_center">
<button
  id="eligibility-open-btn"
  class="et_pb_button et_pb_bg_layout_light"
  style="appearance: none; -webkit-appearance: none; font-family: inherit; color: #0d78ad;"
>Eligibility / LOI</button>
</div>

<div id="eligibility-modal-overlay" style="
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 2147483647;
  align-items: center;
  justify-content: center;
  padding: 20px;
">
  <div style="
    position: relative;
    width: 100%;
    max-width: 640px;
    max-height: 90vh;
    background: transparent;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: none;
  ">
    <iframe
      id="eligibility-iframe"
      src=""
      data-src="https://eligibility-agent.vercel.app/"
      title="Eligibility check"
      style="width: 100%; height: 380px; max-height: 90vh; border: none; display: block; transition: height 0.25s ease;"
    ></iframe>
  </div>
</div>

<script>
(function () {
  var openBtn = document.getElementById('eligibility-open-btn');
  var overlay = document.getElementById('eligibility-modal-overlay');
  var iframe = document.getElementById('eligibility-iframe');

  // Move the overlay to be a direct child of <body>. Left in place, it can
  // get trapped behind theme elements by an ancestor's stacking context
  // (position/transform/opacity/filter), which no z-index can escape.
  document.body.appendChild(overlay);

  openBtn.addEventListener('click', function () {
    // Load the widget fresh each time it's opened, so a previous session doesn't linger.
    iframe.src = iframe.getAttribute('data-src');
    overlay.style.display = 'flex';
  });

  function closeModal() {
    overlay.style.display = 'none';
    iframe.src = '';
  }

  overlay.addEventListener('click', function (e) {
    if (e.target === overlay) closeModal();
  });

  // The widget reports its content height so the dialog can shrink or
  // grow to fit whatever step is currently showing, instead of sitting
  // at a fixed size.
  window.addEventListener('message', function (e) {
    if (!e.data || e.data.source !== 'eligibility-widget') return;
    var maxHeight = Math.round(window.innerHeight * 0.9);
    var height = Math.min(Math.max(e.data.height, 200), maxHeight);
    iframe.style.height = height + 'px';
  });
})();
</script>
